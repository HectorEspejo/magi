[package]
name = "magi-nucleo"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Núcleo compartido de MAGI: almacén, sincronización, conexión SSH, túneles, terminal y registro"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4d3-org/magi"
publish = false

[dependencies]
age = "0.11"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
globset = "0.4"
hkdf = "0.13"
hmac = "0.13"
nix = { version = "0.29", features = ["fs", "hostname", "process", "signal", "user"] }
rusqlite = { version = "0.40", features = ["bundled"] }
russh = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shell-escape = "0.1"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rsa", "encryption", "getrandom"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net", "fs", "process"] }
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1.26", features = ["v4", "v5"] }
vt100 = "0.16"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
