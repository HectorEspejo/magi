[package]
name = "magi-nucleo"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Núcleo compartido de MAGI: almacén, sincronización, conexión SSH, túneles, terminal y registro"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4d3-org/magi"
publish = false

[dependencies]
age = "0.11"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
des = "0.9"
flate2 = "1"
getrandom = "0.4"
ironrdp = { version = "=0.17.0", default-features = false, features = ["core", "pdu", "connector", "session", "graphics", "cliprdr", "displaycontrol", "input", "dvc"] }
ironrdp-egfx = "=0.3.0"
ironrdp-tokio = "=0.10.0"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
x509-parser = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
globset = "0.4"
hkdf = "0.13"
hmac = "0.13"
nix = { version = "0.29", features = ["fs", "hostname", "process", "signal", "user"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
russh = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shell-escape = "0.1"
ssh-key = { version = "=0.7.0-rc.11", features = ["ecdsa", "ed25519", "encryption", "getrandom", "p256", "rsa"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net", "fs", "process"] }
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1.26", features = ["v4", "v5"] }
vt100 = "0.16"
zeroize = "1"

[dev-dependencies]
futures-util = "0.3"
ironrdp-server = { version = "=0.13.0", features = ["helper"] }
signature = "3"
tempfile = "3"
tokio-tungstenite = "0.29"