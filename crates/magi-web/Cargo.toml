[package]
name = "magi-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Generador de la web de MAGI (https://magi.erratia.com): portada, descargas, versiones y manual"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HectorEspejo/magi"
publish = false

# La web no se distribuye: `dist plan` no debe cambiar por este crate.
[package.metadata.dist]
dist = false

[lib]
name = "magi_web"
path = "src/lib.rs"

[[bin]]
name = "magi-web"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
minijinja = { version = "2", default-features = false, features = ["builtins", "debug", "macros", "multi_template", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3"
