[package]
name = "magi-ssh"
version = "1.1.0"
edition = "2021"
rust-version = "1.86"
description = "Gestor SSH de terminal (TUI) con estética de cabina técnica"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4d3-org/magi"
homepage = "https://github.com/4d3-org/magi"
readme = "README.md"
keywords = ["ssh", "tui", "terminal", "sessions", "sftp"]
categories = ["command-line-utilities"]
publish = false
build = "build.rs"

[lib]
name = "magi"
path = "src/lib.rs"

[[bin]]
name = "magi"
path = "src/main.rs"

[dependencies]
age = "0.11"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
crossterm = "0.29"
csv = "1"
directories = "6"
filetime = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
globset = "0.4"
hkdf = "0.13"
hmac = "0.13"
ignore = "0.4"
nix = { version = "0.29", features = ["fs", "hostname", "process", "signal", "user"] }
notify = "8"
nucleo-matcher = "0.3"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
russh = "0.63"
russh-sftp = "=3.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shell-escape = "0.1"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rsa", "encryption", "getrandom"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net", "fs", "process", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-term = "0.3"
unicode-normalization = "0.1"
uuid = { version = "1.26", features = ["v4", "v5"] }
vt100 = "0.16"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Perfil que usa dist para los binarios publicados: LTO fino y strip.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
