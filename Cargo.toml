[package]
name = "magi"
version = "0.1.0"
edition = "2021"
description = "Gestor SSH de terminal (TUI) con estética de cabina técnica"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
csv = "1"
directories = "6"
nucleo-matcher = "0.3"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
russh = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rsa", "encryption", "getrandom"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-term = "0.3"
unicode-normalization = "0.1"
vt100 = "0.16"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
