# Web de MAGI (https://magi.erratia.com) — Fase 9c.
#
# Construye la web (portada, descargas, versiones, 404 y manual) con el
# generador `magi-web` y la despliega en GitHub Pages con Actions. Todo sale del
# repositorio y de la API de GitHub: no hay más fuentes ni más cuentas.
#
# Cuándo corre (informe de la Fase 9c, §5.4 y D451):
#   - Al terminar BIEN «Release», «Release Termux» o «Release Android»
#     (workflow_run, sin filtro de ramas: esas ejecuciones nacen de etiquetas).
#     Una release que falla no regenera la web. No vale `on: release`: una
#     release que crea el GITHUB_TOKEN no dispara otros workflows.
#   - Con un push a main que toque la web, su generador, la demo o este fichero.
#     El manual (docs/manual/) no está en la lista a propósito: sale de la
#     etiqueta de la última versión publicada (D443), no de main.
#   - A mano (workflow_dispatch): la primera publicación y cada vez que haya que
#     retirar algo de lo que enseña la web (por ejemplo, una release borrada).
#
# Qué hace:
#   1. construir: mdBook fijado por versión y SHA-256, scripts/generar-web.sh
#      (lee la API de GitHub y los .sha256, prepara el manual de la etiqueta,
#      construye y comprueba) y sube el sitio como artefacto de Pages. Si algo
#      falla, no se despliega nada y sigue la web anterior.
#   2. desplegar: deploy-pages, solo desde main y en el entorno github-pages.
#
# Permisos: contents: read arriba; pages: write e id-token: write solo en el job
# que despliega (OIDC hacia Pages). Este workflow no usa ningún secreto: el
# token del workflow, de solo lectura, basta para la API de GitHub. Las
# variables PUBLICAR_HOMEBREW y PUBLICAR_AUR son variables del repositorio, no
# secretos. Nada que llegue de fuera (etiquetas, ramas, entradas) se interpola
# en el texto de un script: si hiciera falta, iría por `env`.
#
# La concurrencia es la de Pages: un despliegue a la vez y ninguno se cancela a
# medias.

name: Web

on:
  workflow_run:
    workflows:
      - Release
      - Release Termux
      - Release Android
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'crates/magi-web/**'
      - 'assets/demo/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # mdBook fijado por versión y SHA-256 del tarball musl (estático). mdBook no
  # publica un .sha256: la suma coincide con el digest que da la API de GitHub
  # para ese fichero. Los mismos valores están en el job `web` de ci.yml y en
  # scripts/generar-web.sh; una prueba (crates/magi-web/tests/workflows.rs)
  # comprueba que los tres coinciden.
  MDBOOK_VERSION: '0.5.4'
  MDBOOK_SHA256: '5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89'

jobs:
  construir:
    name: Construir la web
    # Con workflow_run, solo si la release que lo disparó terminó bien.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # Con todas las etiquetas: el manual y los CHANGELOG salen de
          # `git show <etiqueta>:…`.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Instalar mdBook (fijado por versión y SHA-256)
        # Se descarga a fichero, se comprueba su SHA-256 y solo entonces se
        # extrae e instala.
        run: |
          set -euo pipefail
          archivo="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/${archivo}" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${archivo}"
          echo "${MDBOOK_SHA256}  ${RUNNER_TEMP}/${archivo}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/mdbook"
          tar xzf "${RUNNER_TEMP}/${archivo}" -C "${RUNNER_TEMP}/mdbook"
          install -m 755 "${RUNNER_TEMP}/mdbook/mdbook" "$HOME/.cargo/bin/mdbook"
          mdbook --version
      - name: Construir y comprobar la web
        # Lee la API de GitHub (releases y .sha256), prepara el manual de la
        # etiqueta publicada, construye el sitio y lo comprueba. Cualquier dato
        # raro lo para con un mensaje que dice qué y dónde.
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICAR_HOMEBREW: ${{ vars.PUBLICAR_HOMEBREW }}
          PUBLICAR_AUR: ${{ vars.PUBLICAR_AUR }}
        run: scripts/generar-web.sh
      - name: Subir el sitio como artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/web/sitio

  desplegar:
    name: Desplegar en GitHub Pages
    needs: construir
    # Desde main y solo desde main: un workflow_dispatch en otra rama construye
    # y comprueba, pero no publica. Con workflow_run la referencia es main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
