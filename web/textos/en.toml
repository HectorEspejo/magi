# MAGI website texts in English. Same keys as `es.toml`, none empty (`magi-web`
# checks it at build time). No HTML: anything with a link is split into `antes`,
# `enlace` and `despues`, and the template adds the <a>; code goes between
# backticks and the template turns it into <code>.
# The home, screenshot and releases pages add their own tables (`portada`,
# `captura`, `versiones`) without touching the others.

