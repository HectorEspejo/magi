# ===== P2C: portada y capturas (tablas `portada` y `captura`) =====

[portada]
titulo = "MAGI"
titulo_pagina = "MAGI · Terminal SSH manager"
lema = "Terminal SSH manager with a technical-cockpit look, driven from the keyboard."
plataformas_linea = "Linux and macOS · Termux · Android app. Free software with no telemetry."
descargar = "Download"
leer_manual = "Read the manual (Spanish)"
demo_resumen = "Demo animation"
demo_alt = "MAGI in a terminal: the fleet with three sample hosts, Files, Services and the command palette."
capturas_titulo = "What it looks like"
capturas_nota = "Screenshots of the interface itself, which is in Spanish, taken with the demo's made-up hosts."

[portada.que_es]
titulo = "What MAGI is and who it is for"
que = "MAGI is an SSH connection manager that lives in the terminal: it brings your hosts, their sessions, files, tunnels and services together in a single interface driven from the keyboard."
para_quien = "It is for anyone who runs servers or works over SSH every day and wants their fleet at hand, with no accounts and no cloud: developers, system administrators and homelab enthusiasts."
movil = "And if you are on call, the Android app reads your synced inventory and MAGI also runs inside Termux."

[portada.plataformas]
titulo = "Platforms"
introduccion = "The status of each platform, in text. \"In testing\" and \"beta\" mean that automated tests cover them, but they have not been tried by hand in as much detail as Linux."

[portada.libre]
titulo = "Free and telemetry-free"
sin_telemetria = "No accounts, no subscription and no telemetry: MAGI does not check for updates or open any connection other than the ones you make to your own hosts."
licencia = "Free software under `MIT OR Apache-2.0`, your choice."

[portada.enlaces]
titulo = "Links"
descargas = "Downloads"
manual = "Manual (Spanish)"
github = "Source code on GitHub"
seguridad = "Security policy"
contribuir = "How to contribute"

[captura.flota]
