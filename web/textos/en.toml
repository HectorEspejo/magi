descripcion = "All your hosts and their status at a glance."

[captura.sesion-paneles]
titulo = "Session with panes"
descripcion = "Tabs and panes that stay alive when you close the window."

[captura.archivos]
titulo = "Files"
descripcion = "Dual local and remote panel, with transfers that carry on after you close the window."

[captura.tuneles]
titulo = "Tunnels"
descripcion = "Local, remote and dynamic forwards that stay active when you close the window."

[captura.deliberacion]
titulo = "MAGI deliberation"
descripcion = "Three parallel checks, on health, backup and tests, give their verdict before a risky action."

[captura.servicios]
