[portada.que_es]
titulo = "Qué es MAGI y para quién"
que = "MAGI es un gestor de conexiones SSH que vive en la terminal: reúne tus hosts, sus sesiones, los archivos, los túneles y los servicios en una sola interfaz que se maneja con el teclado."
para_quien = "Es para quien administra servidores o trabaja a diario por SSH y quiere tener su flota a mano, sin cuentas ni nube: desarrolladores, administradores de sistemas y aficionados a montar su propio laboratorio."
movil = "Y si te toca guardia, la app Android lee tu inventario sincronizado y MAGI también funciona dentro de Termux."

[portada.plataformas]
titulo = "Plataformas"
introduccion = "El estado de cada plataforma, en texto. «En pruebas» y «beta» quieren decir que las cubren las pruebas automáticas, pero que aún no se han probado a mano con el mismo detalle que Linux."

[portada.libre]
titulo = "Libre y sin telemetría"
sin_telemetria = "Sin cuentas, sin suscripción y sin telemetría: MAGI no comprueba actualizaciones ni abre más conexiones que las que haces a tus hosts."
