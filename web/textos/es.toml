# Textos de la web en castellano. Las mismas claves que `en.toml`, ninguna vacía
# (`magi-web` lo comprueba al construir). Sin HTML: lo que lleva un enlace se
# parte en `antes`, `enlace` y `despues`, y la plantilla pone el <a>; lo que va en
# código se escribe entre acentos graves y la plantilla lo pasa a <code>.
# Las tablas de la portada, de las capturas y de las versiones las añaden sus
# páginas (`portada`, `captura`, `versiones`) sin tocar las demás.

