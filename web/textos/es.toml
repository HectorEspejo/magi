# ===== P2C: portada y capturas (tablas `portada` y `captura`) =====

[portada]
titulo = "MAGI"
titulo_pagina = "MAGI · Gestor SSH de terminal"
lema = "Gestor SSH de terminal, con estética de cabina y manejado con el teclado."
