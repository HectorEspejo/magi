# MAGI · app Android (Fase 11)
# Propiedades del proyecto. Las versiones viven en gradle/libs.versions.toml.

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (AGP 9 ya lo activa por defecto; explícito para el lector)
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 solo crea pruebas de JVM para la variante por defecto. Se habilitan en
# todas porque las tareas de previsualización de Compose de AGP 9.5 las exigen
# también en release (y CI puede ejecutar testReleaseUnitTest).
android.onlyEnableUnitTestForTheTestedBuildType=false

kotlin.code.style=official